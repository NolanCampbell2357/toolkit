[build-system] 
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nolan-campbell-toolkit"
version = "0.1.0"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "mcp>=2.3.0",
    "pyntcore>=2026.2.2",
]
[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.6",
]

[tool.mypy]
strict = true
python_version = "3.14"

[[tool.mypy.overrides]]
module = ["ntcore.*"]
ignore_missing_imports = true
